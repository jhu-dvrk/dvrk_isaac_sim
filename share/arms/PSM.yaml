# Shared PSM defaults. Individual PSM files include this document and
# override only names and frame identifiers.
robot:
  name: PSM
  type: PSM
  model: Virtual/PSM1.urdf.xacro
  parent_frame: world
  base_frame: PSM_base
  base_pose:
    position: [0.0, 0.0, 0.0]
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  rcm_frame: PSM_RCM
  tool_frame: PSM_tool
  adaptor_frame: PSM_adaptor_link
  joints:
    - {name: yaw, type: revolute, lower: -1.5707963, upper: 1.5707963, velocity: 5.0}
    - {name: pitch, type: revolute, lower: -0.7853982, upper: 0.7853982, velocity: 5.0}
    - {name: insertion, type: prismatic, lower: 0.0, upper: 0.240, velocity: 0.4}
    - {name: roll, type: revolute, lower: -4.53786, upper: 4.53786, velocity: 50.0}
    - {name: wrist_pitch, type: revolute, lower: -1.2217, upper: 1.2217, velocity: 50.0}
    - {name: wrist_yaw, type: revolute, lower: -1.39626, upper: 1.39626, velocity: 50.0}
  home_position: [0.0, 0.0, 0.12, 0.0, 0.0, 0.0]
  asset: {instrument: "420006", use_instrument_visual: true}
  jaw:
    lower: -0.349066
    upper: 1.39626
    pid:
      kp: 90.0
      ki: 0.0
      kd: 6.0
      max_effort: 18.0
      inertia: 1.0
      max_velocity: 1.2
      target_rate: 1.5
      integral_limit: 0.25
      effort_deadband: 0.0
  control: {mode: kinematic, update_rate_hz: 120.0, state_publish_rate_hz: 100.0, command_timeout_s: 0.25, invalid_command_policy: reject}
  cartesian: {reference_frame: world, measured_frame: PSM_tool}
