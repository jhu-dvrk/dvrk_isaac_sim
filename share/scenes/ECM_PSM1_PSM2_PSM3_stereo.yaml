scene:
  name: ECM_PSM1_PSM2_PSM3_stereo
  base_frame_provider: yaml
  # SUJ Fixed defaults: frame poses are RCM/base poses in world (meters, ROS xyzw).
  # Replace these values with registered poses or use a future TF provider.
  frames:
    PSM1: {position: [-0.100000000, 0.000000000, 0.173205081], orientation_xyzw: [0.000000000, -0.258819045, 0.000000000, 0.965925826]}
    PSM2: {position: [0.100000000, 0.000000000, 0.173205081], orientation_xyzw: [0.000000000, 0.258819045, 0.000000000, 0.965925826]}
    PSM3: {position: [0.173205081, 0.000000000, 0.100000000], orientation_xyzw: [0.000000000, 0.500000000, 0.000000000, 0.866025404]}
    ECM: {position: [0.000000000, 0.000000000, 0.200000000], orientation_xyzw: [0.000000000, 0.000000000, 0.000000000, 1.000000000]}
  camera:
    mode: stereo
    owner: ECM
    frame: ECM_optical
    width: 1280
    height: 720
    horizontal_fov_deg: 60.0
    near_clip_m: 0.005
    far_clip_m: 10.0
    encoding: rgba8
    baseline_m: 0.006
    publish_rate_hz: 30.0
    transports: [rtsp]
    rtsp: {port: 8554, mount_path: /ECM, encoding: raw}
  robots:
    - config: package://dvrk_arm_description/arms/PSM1.yaml
      instrument: "420006"
    - config: package://dvrk_arm_description/arms/PSM2.yaml
      instrument: "420093"
    - config: package://dvrk_arm_description/arms/PSM3.yaml
      instrument: "420006"
    - config: package://dvrk_arm_description/arms/ECM.yaml
      endoscope: "Si_straight"
